[package]
name = "free-cell"
version = "0.1.0"
description = "An offline FreeCell game"
authors = ["codexu"]
edition = "2021"

[lib]
name = "free_cell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIView", "UIWindow", "UIScrollView", "UIGeometry", "objc2-core-foundation"] }
